# ========== DOSYA: sentinel-news-ingest/Cargo.toml ==========
[package]
name = "sentinel-news-ingest"
version = "0.8.2"
edition = "2021"

[dependencies]
# HFT Runtime
tokio = { version = "1.36", features = ["full"] }
async-nats = "0.34"
prost = "0.12"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = "0.4"

# Ağ ve Veri Çekme (Real-Path)
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
rss = "2.0" # RSS Parser
url = "2.5"

# Zero-Allocation & Performance
bytes = "1.5"
moka = { version = "0.12", features = ["future"] } # TTL'li Deduplication Cache
sha2 = "0.10" # Haberleri parmak iziyle (hash) tanımak için

[build-dependencies]
prost-build = "0.12"