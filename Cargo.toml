# ========== DOSYA: sentinel-news-ingest/Cargo.toml ==========
[package]
name = "sentinel-news-ingest"
version = "0.3.0"
edition = "2021"

[dependencies]
tokio = { version = "1.36", features = ["full", "rt-multi-thread"] }
async-nats = "0.34"
prost = "0.12"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
chrono = "0.4"

# Ağ ve WebSocket (Gerçek Zamanlı Veri)
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"

# Bellek dostu (Zero-Copy) veri işleme
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.5"

[build-dependencies]
prost-build = "0.12"